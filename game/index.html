<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Copper Ladle — a diner-rescue cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #170b10; }
  body { display: grid; place-items: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    touch-action: none;
    cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Copper Ladle: cook for customers, build each dish layer by layer, and earn the day's goal to repay Rosa's loan."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
